# Transparent USV detector (src/rat_usv/signal/detect.py). Tuned 2026-10-01 against
# 2020 Avisoft exports on a 36-recording tuning sample (seed 1, 4 per litter x age band).
nperseg: 512          # 2.4 ms Hann window at 214285 Hz
hop: 128              # 0.6 ms
fmin_hz: 18000
fmax_hz: 100000
smooth_freq_bins: 3   # ~1.3 kHz
smooth_frames: 5      # ~3 ms
chunk_s: 30.0
chunk_overlap_s: 0.5
high_db: 10.0         # seed threshold, dB above each bin's median
low_db: 6.0           # extension threshold
click_fraction: 0.3   # broadband frame rejection
max_peak_width_khz: 4.0   # tonality: spectrum within 10 dB of the frame peak
min_peak_freq_khz: 25.0   # rejects band-edge noise; 1.6% of 2020 calls dip below 25 kHz
merge_gap_ms: 8.0
min_duration_ms: 4.0
max_duration_ms: 1500.0
