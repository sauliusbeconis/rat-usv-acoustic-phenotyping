repos:
  - repo: local
    hooks:
      - id: research-data-guard
        name: Reject private data and large artifacts
        entry: uv run --frozen python scripts/check_git_safety.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy source
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        types: [python]
